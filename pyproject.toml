[project]
name = "freshfin"
version = "0.1.0"
description = "A live benchmark of how often AI models make up numbers about new financial filings"
readme = "README.md"
license = "MIT"
authors = [{ name = "Satya", email = "satyateja619@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
freshfin = "freshfin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["freshfin", "helpers"]
